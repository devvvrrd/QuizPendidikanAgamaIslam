<!doctype html><html><head><meta charset=utf-8><title>Quiz Pendidikan Agama Islam</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* QuizLearn: monokrom hitam-putih-abu dengan efek kaca (glass).
   Tata letak: satu kolom sempit seperti aplikasi HP, kartu kaca di atas latar abu bergradasi,
   navigasi melayang di bawah. Semua warna diatur lewat variabel di bawah ini. */
:root{
  --bg:#E8E8E8;
  --ink:#0A0A0A;
  --ink-2:#4F4F4F;
  --glass:rgba(255,255,255,.52);
  --glass-hi:rgba(255,255,255,.72);
  --edge:rgba(255,255,255,.82);
  --track:rgba(0,0,0,.10);
  --shadow:0 8px 24px rgba(0,0,0,.07), inset 0 1px 0 rgba(255,255,255,.9);
  --dark-1:#2C2C2C;
  --dark-2:#0A0A0A;
  --font:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:14px;
  line-height:1.5;
}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.on-dark :focus-visible{outline-color:#fff}

/* latar */
.bg{
  position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(320px 320px at 100% 0%, #fff 0%, rgba(255,255,255,0) 70%),
    radial-gradient(320px 320px at 0% 42%, rgba(90,90,90,.38) 0%, rgba(90,90,90,0) 70%),
    radial-gradient(340px 340px at 100% 86%, rgba(60,60,60,.34) 0%, rgba(60,60,60,0) 70%),
    linear-gradient(165deg,#F6F6F6 0%,#DCDCDC 48%,#F0F0F0 100%);
}

/* kerangka */
.app{
  max-width:520px;margin:0 auto;
  padding-block:20px 120px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:14px;
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:40px;height:40px;border-radius:12px;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.brand-name{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand-sub{font-size:12px;color:var(--ink-2)}
main{display:flex;flex-direction:column;gap:14px;min-width:0;outline:none}

h1.h1{margin:6px 0 0;font-size:27px;font-weight:800;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
h2.h2{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
h3.h3{margin:0;font-size:15px;font-weight:700}
.lead{margin:0;color:var(--ink-2);font-size:14px;line-height:1.5}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink);flex:none}
.muted{color:var(--ink-2)}
.small{font-size:12px}

/* kaca */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(125%);
  backdrop-filter:blur(20px) saturate(125%);
  border:1px solid var(--edge);
  box-shadow:var(--shadow);
}
.card{border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

/* tombol */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 20px;border-radius:23px;
  border:1px solid rgba(255,255,255,.18);
  background:linear-gradient(180deg,var(--dark-1),var(--dark-2));
  color:#fff;font-weight:700;
  box-shadow:0 8px 18px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.22);
  text-align:center;
}
.btn[disabled]{background:rgba(0,0,0,.12);color:#5A5A5A;box-shadow:none;border-color:transparent;cursor:not-allowed}
.btn-ghost{
  background:var(--glass-hi);color:var(--ink);border:1px solid var(--edge);
  box-shadow:0 4px 12px rgba(0,0,0,.06), inset 0 1px 0 rgba(255,255,255,.9);
}
.btn-ghost[disabled]{background:rgba(255,255,255,.35);color:#5A5A5A}
.btn-light{background:rgba(255,255,255,.94);color:var(--ink);border-color:rgba(255,255,255,.9);box-shadow:none}
.btn-sm{min-height:40px;padding:0 16px;font-size:13px}
.btn-block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 120px}
.back{
  align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:40px;
  padding:0 14px 0 10px;border-radius:20px;border:1px solid var(--edge);background:var(--glass-hi);font-weight:600;font-size:13px;
}

/* progress */
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#3A3A3A,var(--ink))}

/* statistik */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{border-radius:20px;padding:12px 10px;display:flex;flex-direction:column;gap:6px}
.stat svg{display:block}
.stat b{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;line-height:1.3;color:var(--ink-2)}

/* kartu gelap */
.dark{
  position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(135deg,rgba(44,44,44,.94),rgba(10,10,10,.96));
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 14px 32px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.2);
}
.dark::before{
  content:"";position:absolute;top:-70px;right:-50px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 70%);pointer-events:none;
}
.dark>*{position:relative}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#CFCFCF}
.dark .meta{color:#CFCFCF;font-size:13px}
.cta{flex-direction:row;align-items:center;gap:14px;flex-wrap:wrap}
.cta .grow{flex:1 1 160px;display:flex;flex-direction:column;gap:3px}
.cta .t{font-size:17px;font-weight:700;line-height:1.25}

/* daftar bab */
.listbtn{
  width:100%;text-align:left;flex-direction:row;align-items:center;gap:12px;color:var(--ink);
}
.listbtn .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.listbtn .tt{font-weight:700;font-size:15px;line-height:1.3}
.listbtn .ds{font-size:12px;color:var(--ink-2)}
.num{
  flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--edge);
  background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(210,210,210,.6));
  display:flex;align-items:center;justify-content:center;font-weight:800;
  box-shadow:0 6px 14px rgba(0,0,0,.08), inset 0 1px 0 #fff;
}

.note{font-size:12px;color:var(--ink-2);line-height:1.5}

/* soal */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* Transisi saat berpindah soal: kartu soal keluar sebentar, lalu masuk dari arah tujuan.
   Hanya opacity dan transform yang dianimasikan agar tetap ringan di HP. */
@keyframes qIn{from{opacity:0;transform:translate3d(var(--qx,18px),0,0)}to{opacity:1;transform:translate3d(0,0,0)}}
.qsec.q-in-next{--qx:18px;animation:qIn .26s cubic-bezier(.22,.68,0,1) backwards;will-change:transform,opacity}
.qsec.q-in-prev{--qx:-18px;animation:qIn .26s cubic-bezier(.22,.68,0,1) backwards;will-change:transform,opacity}
.qsec.q-out-next,.qsec.q-out-prev{opacity:0;transition:opacity .11s ease-in,transform .11s ease-in;will-change:transform,opacity}
.qsec.q-out-next{transform:translate3d(-12px,0,0)}
.qsec.q-out-prev{transform:translate3d(12px,0,0)}
#main.q-swap .qsec *{transition:none!important}
@media(prefers-reduced-motion:reduce){.qsec.q-in-next,.qsec.q-in-prev{animation:none}.qsec.q-out-next,.qsec.q-out-prev{transition:none}.ov,.ov .sheet,.ov.is-closing,.ov.is-closing .sheet{animation:none!important}}
/* Transisi halus untuk perubahan status (pilihan jawaban, progres, nomor soal, tombol kalkulator, dock) */
html{scrollbar-gutter:stable}
.opt{transition:background-color .22s ease,color .22s ease,border-color .22s ease,opacity .22s ease,transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease,filter .18s ease}
.opt .lt{transition:background-color .22s ease,color .22s ease,border-color .22s ease}
.bar>i{transition:width .38s cubic-bezier(.22,.68,0,1)}
.nb{transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease,filter .18s ease}
.ck{transition:transform .12s cubic-bezier(.2,.8,.2,1),background-color .12s ease,box-shadow .12s ease,filter .12s ease}
.cdisp .cd{transition:font-size .12s ease}
.dock button{transition:background-color .25s ease,color .25s ease,transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease,filter .18s ease}
.ov{will-change:opacity}
.ov .sheet{will-change:transform,opacity}
.chip{
  display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 12px;border-radius:14px;
  background:var(--glass-hi);border:1px solid var(--edge);font-size:12px;font-weight:600;
}
.qtext{margin:0;font-size:17px;font-weight:700;line-height:1.4;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:52px;padding:12px 14px;border-radius:18px;
  background:var(--glass-hi);border:1px solid var(--edge);
  box-shadow:0 4px 12px rgba(0,0,0,.05), inset 0 1px 0 rgba(255,255,255,.9);
  line-height:1.4;
}
.opt .lt{
  flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin:0;
}
.opt .tx{flex:1;min-width:0}
.opt .tag{display:block;margin-top:4px;font-size:12px;font-weight:700}
.opt.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt.sel .lt{border-color:#fff;background:#fff;color:var(--ink)}
.opt.ok{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt.ok .lt{border-color:#fff;background:#fff;color:var(--ink)}
.opt.bad{background:rgba(255,255,255,.9);border:2px dashed var(--ink)}
.opt.bad .tx>span:first-child{text-decoration:line-through;text-decoration-thickness:1.5px}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.og{display:flex;flex-direction:column;gap:8px}
.ex{margin:0 4px;border-radius:14px;padding:10px 14px;background:var(--glass-hi);border:1px solid var(--edge);display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.5}
.ex.ok{border:1.5px solid var(--ink)}
.ex.bad{border:1.5px dashed var(--ink)}
.ex b{display:flex;align-items:center;gap:6px;font-size:13px}
.ex p{margin:0}
.fb{border-radius:18px;padding:14px;background:var(--glass-hi);border:1px solid var(--edge);display:flex;flex-direction:column;gap:4px}
.fb b{font-size:15px;display:flex;align-items:center;gap:8px}
.fb p{margin:0;line-height:1.55}

/* ujian */
.timer{
  margin-left:auto;background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;
}
.timer[data-low="1"]{background:#fff;color:var(--ink);text-decoration:underline}
.chip-btn{position:relative;cursor:pointer;color:var(--ink)}
.chip-btn::after{content:"";position:absolute;inset:-8px -4px}
.ctl{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:10px}
.ctl .btn{padding:0;min-width:0}
.btn-step{line-height:1}
.btn-step svg{display:block;flex:none}
.btn-ragu[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.nb{position:relative}
.nb.ragu{background:#8C8C8C;border-color:#8C8C8C;color:#0A0A0A}
.nb.ragu .l{color:#0A0A0A}
.nb .n{font-size:15px}
#overlay:empty{display:none}
.ov{
  position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  padding:16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  background:rgba(10,10,10,.38);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  animation:popupBackdropIn .2s ease-out both;
}
@keyframes popupBackdropIn{from{opacity:0}to{opacity:1}}
@keyframes popupSheetIn{from{opacity:0;transform:translate3d(0,18px,0) scale(.975)}to{opacity:1;transform:translate3d(0,0,0) scale(1)}}
@keyframes popupSheetOut{from{opacity:1;transform:translate3d(0,0,0) scale(1)}to{opacity:0;transform:translate3d(0,10px,0) scale(.985)}}
@keyframes popupBackdropOut{from{opacity:1}to{opacity:0}}
.ov .sheet{animation:popupSheetIn .24s cubic-bezier(.2,.75,.25,1) both;transform-origin:center bottom}
.ov.is-closing{pointer-events:none;animation:popupBackdropOut .17s ease-in both}
.ov.is-closing .sheet{animation:popupSheetOut .17s ease-in both}
.sheet{
  width:100%;max-width:440px;max-height:calc(100% - 8px);overflow:auto;border-radius:24px;padding:16px;
  display:flex;flex-direction:column;gap:12px;
  background:rgba(255,255,255,.9);border:1px solid var(--edge);box-shadow:0 24px 60px rgba(0,0,0,.28);
}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.iconbtn{
  width:40px;height:40px;border-radius:20px;border:1px solid var(--edge);background:var(--glass-hi);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:7px;border:1px solid rgba(0,0,0,.25);background:#fff;font-style:normal;font-weight:800;font-size:11px;color:var(--ink)}
.lg-done{background:var(--ink);border-color:var(--ink);color:#fff}
.lg-now{border:2.5px solid var(--ink)}
.lg-ragu{background:#8C8C8C;border-color:#8C8C8C;color:#0A0A0A}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.nb{
  min-height:54px;border-radius:14px;border:1px solid var(--edge);background:var(--glass-hi);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:0;
  font-variant-numeric:tabular-nums;
}
.nb .n{font-size:15px;font-weight:800}
.nb .l{font-size:12px;font-weight:700;color:var(--ink-2)}
.nb.done{background:var(--ink);border-color:var(--ink);color:#fff}
.nb.done .l{color:#fff}
.chip-ico{padding:0;width:36px;justify-content:center}
.chip-ico svg{display:block}
.cdisp{border-radius:18px;padding:12px 16px;background:rgba(255,255,255,.7);border:1px solid var(--edge);display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;gap:2px;min-height:84px;overflow:hidden}
.cdisp .ce{font-size:13px;color:var(--ink-2);min-height:20px;max-width:100%;white-space:nowrap;overflow:hidden}
.cdisp .cd{font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;max-width:100%;white-space:nowrap;overflow:hidden}
.ckeys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ck{height:52px;border-radius:16px;border:1px solid var(--edge);background:var(--glass-hi);color:var(--ink);font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation;box-shadow:0 4px 12px rgba(0,0,0,.05), inset 0 1px 0 rgba(255,255,255,.9)}
.ck svg{display:block}
.ck.fn{background:rgba(0,0,0,.08)}
.ck.op{background:linear-gradient(180deg,var(--dark-1),var(--dark-2));color:#fff;border-color:rgba(255,255,255,.18)}
.ck:active{transform:scale(.96)}
.nb.bad{background:rgba(255,255,255,.9);border:2px dashed var(--ink)}
.sheet-h h2.h2{font-size:19px}
.nb.now{border:3px solid var(--ink);box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.nb.done.now{box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--ink)}
.confirm{border-radius:18px;padding:14px;background:rgba(255,255,255,.9);border:2px solid var(--ink);display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;line-height:1.5}
ol.rules,ul.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.5}

/* hasil */
.score{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:20px;font-weight:700;color:var(--ink-2);letter-spacing:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.two .glass{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:2px}
.two b{font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.two span{font-size:12px;color:var(--ink-2)}

/* riwayat */
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--glass-hi);border:1px solid var(--edge);
}
.hist .hn{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.hist .hn b{font-size:13px}
.hist .hn span{font-size:12px;color:var(--ink-2)}
.hist .nv{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
/* penguasaan */
.mast,.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:18px;background:var(--glass-hi);border:1px solid var(--edge)}
.mtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.mt{font-weight:700;font-size:14px;line-height:1.35;min-width:0}
.mbot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{
  flex:none;display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:12px;
  font-size:11px;font-weight:700;white-space:nowrap;border:1.5px solid var(--ink);background:#fff;color:var(--ink);
}
.pill-kuasai{background:var(--ink);color:#fff}
.pill-belum{border-style:dashed}
.pill-data{border-color:rgba(0,0,0,.3);color:var(--ink-2);font-weight:600}
.qlist li{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:18px;background:var(--glass-hi);border:1px solid var(--edge)}
.qt{font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qm{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
textarea{
  width:100%;min-height:96px;resize:vertical;padding:12px;border-radius:16px;border:1px solid var(--edge);
  background:rgba(255,255,255,.85);line-height:1.4;
}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.filebtn:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.empty{margin:0;padding:18px 8px;text-align:center;color:var(--ink-2);line-height:1.5}

/* grafik */
.chart{display:block;width:100%;height:auto}
.chart .gl{stroke:rgba(0,0,0,.10);stroke-width:1}
.chart text{font-family:var(--font);font-size:10px;fill:var(--ink-2)}
.chart .ln{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .pt{fill:#fff;stroke:var(--ink);stroke-width:2.5}
.chart .pe{fill:var(--ink);stroke:#fff;stroke-width:2}
.chart .tip{fill:var(--ink)}
.chart text.tipt{fill:#fff;font-weight:700;font-size:11px}

/* navigasi bawah */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding-left:max(14px, env(safe-area-inset-left, 0px));
  padding-right:max(14px, env(safe-area-inset-right, 0px));
  padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px));
  pointer-events:none;
}
.dock-bar{
  pointer-events:auto;max-width:520px;margin:0 auto;height:68px;padding:0 8px;border-radius:32px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.62);
  -webkit-backdrop-filter:blur(24px) saturate(130%);backdrop-filter:blur(24px) saturate(130%);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 12px 32px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.95);
}
.dock button{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:54px;margin:0 2px;padding:0;
  border:0;border-radius:24px;background:transparent;color:var(--ink-2);font-size:11px;font-weight:600;
}
.dock button[aria-current="page"]{background:var(--ink);color:#fff;font-weight:700}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,12px);z-index:30;
  max-width:min(440px, calc(100vw - 32px));padding:12px 18px;border-radius:18px;background:var(--ink);color:#fff;
  font-weight:600;font-size:13px;line-height:1.4;text-align:center;opacity:0;pointer-events:none;
  transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.wel{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  padding:24px max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px))}
.wel.fade{opacity:0;transition:opacity .25s ease}
.wel-blur{position:absolute;inset:0;background:rgba(240,240,240,.42);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.wel-body{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;
  animation:welIn .7s cubic-bezier(.22,1,.36,1) backwards;transition:opacity .35s ease, transform .35s ease}
.wel-body.out{opacity:0;transform:scale(.96);pointer-events:none}
.wel-t{margin:0;font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.wel-btn{min-height:56px;padding:0 36px;font-size:17px;border-radius:28px}
@keyframes welIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes ldIn{from{opacity:0}to{opacity:1}}
.ld .wel-blur{animation:ldIn .25s ease both}
.ld-pct{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.ld-bar{width:min(240px,64vw);height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.ld-bar i{display:block;height:100%;width:100%;border-radius:4px;background:var(--ink);transform:scaleX(0);transform-origin:left;will-change:transform}
.ld-lbl{font-size:14px;font-weight:600;color:var(--ink-2)}
@media (max-width:360px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .score{font-size:52px}
}

/* Efek interaksi universal untuk seluruh tombol, termasuk navigasi dan tombol dinamis */
:where(button, input[type="button"], input[type="submit"], input[type="reset"], [role="button"], .btn, .back, .filebtn, .chip-btn){
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  cursor:pointer;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease,filter .18s ease,background-color .18s ease;
  transform-origin:center;
}
@media (hover:hover) and (pointer:fine){
:where(button, input[type="button"], input[type="submit"], input[type="reset"], [role="button"], .btn, .back, .filebtn, .chip-btn):not([disabled]):not([aria-disabled="true"]):hover{
  filter:brightness(1.08);
  box-shadow:0 0 0 1px rgba(255,255,255,.22),0 0 16px rgba(255,255,255,.16);
}
}
:where(button, input[type="button"], input[type="submit"], input[type="reset"], [role="button"], .btn, .back, .filebtn, .chip-btn):not([disabled]):not([aria-disabled="true"]):active,
:where(button, input[type="button"], input[type="submit"], input[type="reset"], [role="button"], .btn, .back, .filebtn, .chip-btn).ql-pressed{
  transform:scale(.955);
  filter:brightness(1.16);
  box-shadow:0 0 0 2px rgba(255,255,255,.62),0 0 10px rgba(255,255,255,.42),0 0 24px rgba(255,255,255,.24);
}
:where(button, input[type="button"], input[type="submit"], input[type="reset"], [role="button"], .btn, .back, .filebtn, .chip-btn):not([disabled]):not([aria-disabled="true"]):focus-visible{
  outline:2px solid currentColor;
  outline-offset:3px;
}
@media (prefers-reduced-motion:reduce){
  :where(button, input[type="button"], input[type="submit"], input[type="reset"], [role="button"], .btn, .back, .filebtn, .chip-btn){transition:none}
}

  var ovKey = '';
  function overlayKey() {
    var on = (navOpen || calcOpen) && ((view === 'ujian' && aktif && !ujHasil) || (view === 'latihan' && lat.fase === 'jalan'));
    if (!on) { navOpen = false; calcOpen = false; return ''; }
    return calcOpen ? 'calc' : (view === 'latihan' ? 'lat-nav' : 'uj-nav');
  }
  function setInert(on) {
    [document.querySelector('.app'), document.getElementById('dock')].forEach(function (x) {
      if (!x) return;
      if (on) x.setAttribute('inert', ''); else x.removeAttribute('inert');
    });
  }
  // Hanya membangun ulang pop-up bila jenisnya berubah, sehingga animasi buka tidak terulang dan isi halaman tidak berkedip.
  function syncOverlay() {
    var key = overlayKey();
    if (key === ovKey && (key === '' || $ov.firstChild)) return;
    ovKey = key;
    $ov.innerHTML = key === 'calc' ? vCalcPopup() : key === 'lat-nav' ? vLatNavPopup() : key === 'uj-nav' ? vNavPopup() : '';
    setInert(!!key);
    document.body.style.overflow = key ? 'hidden' : '';
  }
  function closePopup(cb) {
    var popup = $ov.querySelector('.ov');
    var selesai = function () { navOpen = false; calcOpen = false; syncOverlay(); if (cb) cb(); };
    if (!popup) { selesai(); return; }
    if (popup.classList.contains('is-closing')) return;
    popup.classList.add('is-closing');
    setTimeout(selesai, reduced() ? 0 : 175);
  }
  function fokus(act) {
    var el = document.querySelector('[data-act="' + act + '"]');
    if (el) el.focus();
  }

  function render(opts) {
    opts = opts || {};
    if (pendingNav) {
      clearTimeout(pendingNav.t);
      if (!opts.questionDirection) { opts.questionDirection = pendingNav.arah; opts.top = true; }
      pendingNav = null;
    }
    var html;
    if (view === 'latihan') html = vLatihan();
    else if (view === 'ujian') html = vUjian();
    else if (view === 'progres') html = vProgres();
    else html = vBeranda();
    var swap = !!opts.questionDirection && isQuestionView() && lastView === view && !reduced();
    if (swap) $main.classList.add('q-swap');   // matikan transisi isi kartu selama soal diganti
    patchMain(html, lastView !== view);
    if (swap) {
      animQuestion(opts.questionDirection);
      var lepas = function () { $main.classList.remove('q-swap'); };
      if (window.requestAnimationFrame) requestAnimationFrame(function () { requestAnimationFrame(lepas); });
      else setTimeout(lepas, 50);
    }
    syncOverlay();
    renderDock();
    document.title = 'QuizLearn - ' + D.mapel;
    if (lastView !== view || opts.top) {
      window.scrollTo(0, 0);
      if (lastView !== view) { try { $main.focus({ preventScroll: true }); } catch (e) {} }
    }
    lastView = view;
    tick();
  }

  function go(v) {
    if (terkunci() && v !== 'ujian') { toast(PESAN_KUNCI); return; }
    if (location.hash === '#' + v) { view = v; render(); }
    else { location.hash = v; }
  }
  window.addEventListener('hashchange', function () {
    var v = readHash();
    // Tombol Kembali / ubah alamat saat ujian berjalan: batalkan dan tetap di ujian.
    if (terkunci() && v !== 'ujian') { kembaliKeUjian(); view = 'ujian'; toast(PESAN_KUNCI); render(); return; }
    view = v; render();
  });
  // Peringatan bila pengguna mencoba menutup / memuat ulang halaman saat ujian berjalan.
  window.addEventListener('beforeunload', function (e) {
    if (terkunci()) { e.preventDefault(); e.returnValue = ''; return ''; }
  });

  /* ----- grafik nilai ----- */
  function chart(h) {
    var d = h.slice(-7), n = d.length;
    if (!n) return '<p class="empty">Belum ada data. Selesaikan satu ujian untuk melihat grafik nilai.</p>';
    var x0 = 40, x1 = 292, base = 130;
    var pts = d.map(function (r, i) {
      return { x: n === 1 ? 166 : x0 + i * (x1 - x0) / (n - 1), y: base - r.nilai, r: r, no: h.length - n + i + 1 };
    });
    var last = pts[n - 1];
    var s = '<svg class="chart" viewBox="0 0 320 152" role="img" aria-label="Grafik nilai ujian terakhir, nilai terbaru ' + fmtNum(last.r.nilai) + '">';
    s += '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A0A0A" stop-opacity="0.18"/><stop offset="1" stop-color="#0A0A0A" stop-opacity="0"/></linearGradient></defs>';
    [100, 75, 50, 25, 0].forEach(function (v) {
      s += '<line class="gl" x1="30" y1="' + (base - v) + '" x2="312" y2="' + (base - v) + '"/>';
      s += '<text x="24" y="' + (base - v + 3) + '" text-anchor="end">' + v + '</text>';
    });
    if (n > 1) {
      s += '<path d="M' + pts[0].x + ',' + base + ' ' + pts.map(function (p) { return 'L' + p.x + ',' + p.y; }).join(' ') + ' L' + last.x + ',' + base + ' Z" fill="url(#ag)"/>';
      s += '<polyline class="ln" points="' + pts.map(function (p) { return p.x + ',' + p.y; }).join(' ') + '"/>';
    }
    pts.forEach(function (p, i) {
      if (i < n - 1) s += '<circle class="pt" cx="' + p.x + '" cy="' + p.y + '" r="4.5"/>';
    });
    s += '<circle class="pe" cx="' + last.x + '" cy="' + last.y + '" r="5.5"/>';
    var ty = Math.max(2, last.y - 28), tx = Math.min(last.x - 20, 278);
    s += '<rect class="tip" x="' + tx + '" y="' + ty + '" width="40" height="18" rx="9"/>';
    s += '<text class="tipt" x="' + (tx + 20) + '" y="' + (ty + 13) + '" text-anchor="middle">' + fmtNum(last.r.nilai) + '</text>';
    pts.forEach(function (p) { s += '<text x="' + p.x + '" y="147" text-anchor="middle">#' + p.no + '</text>'; });
    return s + '</svg>';
  }

  /* ----- beranda ----- */
  function statsHtml(st) {
    var items = [
      ['clip', st.n ? String(st.n) : '0', 'Ujian Selesai'],
      ['target', st.avg === null ? '–' : fmtNum(st.avg), 'Rata-rata Nilai'],
      ['trophy', st.max === null ? '–' : fmtNum(st.max), 'Nilai Tertinggi'],
      ['star', st.last === null ? '–' : fmtNum(st.last), 'Nilai Terakhir']
    ];
    return '<div class="stats">' + items.map(function (it) {
      return '<div class="glass stat">' + ic(it[0], 24) + '<b>' + it[1] + '</b><span>' + it[2] + '</span></div>';
    }).join('') + '</div>';
  }

  function vBeranda() {
    var h = getHist(), st = stats(h);
    var jml = Math.min(D.pengaturan.ujianJumlahSoal, ALL.length), mnt = D.pengaturan.ujianMenit;
    var html = '<h1 class="h1">Selamat Datang Kembali!</h1>' +
      '<p class="lead">Berlatih, lalu uji pemahamanmu di ' + esc(D.mapel) + '.</p>';
    if (aktif) {
      html += '<section class="glass card" style="flex-direction:row;align-items:center;flex-wrap:wrap"><div style="flex:1 1 160px"><h3 class="h3">Ujian sedang berjalan</h3><span class="muted small">Waktu terus berjalan. Lanjutkan sebelum habis.</span></div><button type="button" class="btn btn-sm" data-act="go" data-v="ujian">Lanjutkan</button></section>';
    }
    html += statsHtml(st);
    html += '<section class="card dark on-dark"><div class="eyebrow">Ujian Quiz</div>' +
      '<div class="cta"><div class="grow"><div class="t">Uji pemahamanmu</div><div class="meta">' + jml + ' soal, ' + mnt + ' menit</div></div>' +
      '<button type="button" class="btn btn-light" data-act="go" data-v="ujian">Mulai Ujian ' + ic('arrow', 16) + '</button></div></section>';
    html += '<section class="glass card"><h2 class="h2"><span class="dot"></span>Perkembangan Nilai Ujian</h2>' + chart(h) + '</section>';
    return html;
  }

  /* ----- latihan ----- */
  function latBaru() { return { fase: 'awal', list: [], i: 0, ans: {}, b: 'semua', label: '' }; }

  function latHitung() {
    var dj = 0, bn = 0;
    lat.list.forEach(function (id) {
      var v = lat.ans[id];
      if (v !== undefined) { dj++; if (v === Q[id].kunci) bn++; }
    });
    return { dj: dj, bn: bn };
  }

  function exTeks(ok, teks) {
    return '<div class="ex ' + (ok ? 'ok' : 'bad') + '"><b>' + ic(ok ? 'check' : 'x', 16) + (ok ? 'Mengapa jawaban ini benar' : 'Mengapa jawaban ini salah') + '</b><p>' + esc(teks) + '</p></div>';
  }

  function vLatihan() {
    if (lat.fase === 'awal') {
      return '<h1 class="h1">Latihan Quiz</h1><p class="lead">Kerjakan seluruh soal dalam satu rangkaian. Setiap jawaban langsung dikoreksi dan dijelaskan, tanpa batas waktu.</p>' +
        '<section class="glass card"><h2 class="h2"><span class="dot"></span>Cara Berlatih</h2><ol class="rules">' +
        '<li>Bacalah setiap soal dengan teliti.</li>' +
        '<li>Pilih satu jawaban yang paling tepat.</li>' +
        '<li>Koreksi dan penjelasan langsung muncul setelah kamu memilih.</li>' +
        '<li>Jawaban yang sudah dipilih tidak bisa diubah.</li>' +
        '<li>Gunakan tombol Nomor untuk berpindah ke soal lain.</li>' +
        '<li>Hasil latihan tidak disimpan di Progres.</li></ol>' +
        (ALL.length ? '<button type="button" class="btn btn-block" data-act="lat-mulai">' + ic('pencil', 18) + 'Mulai Latihan (' + ALL.length + ' soal)</button>' : '<button type="button" class="btn btn-block" disabled>Mulai Latihan</button><p class="note" style="text-align:center">Belum ada soal tersedia.</p>') + '</section>';
    }
    var n = lat.list.length, c = latHitung();
    if (lat.fase === 'selesai') {
      var pct = Math.round(c.bn / n * 1000) / 10;
      return '<h1 class="h1">Latihan Selesai</h1>' +
        '<section class="glass card"><div class="eyebrow" style="color:var(--ink-2)">' + esc(lat.label) + '</div><div class="score">' + c.bn + '<small> / ' + n + ' benar</small></div><p class="lead">Ketepatan ' + fmtNum(pct) + '%. Hasil latihan tidak disimpan di Progres.</p></section>' +
        '<div class="row"><button type="button" class="btn" data-act="lat-ulang">Ulangi</button><button type="button" class="btn btn-ghost" data-act="lat-keluar">Kembali</button></div>';
    }
    var id = lat.list[lat.i], q = Q[id], pilih = lat.ans[id], done = pilih !== undefined, sisa = n - c.dj;
    var h = '<div class="qhead"><span class="chip">Soal ' + (lat.i + 1) + ' dari ' + n + '</span>' +
      '<button type="button" class="chip chip-btn" data-act="nav-buka" aria-haspopup="dialog" aria-label="Buka navigasi soal">' + ic('grid', 14) + '</button>' +
      '<button type="button" class="chip chip-btn chip-ico" data-act="calc-buka" aria-haspopup="dialog" aria-label="Buka kalkulator">' + ic('calc', 16) + '</button>' +
      '<button type="button" class="btn btn-ghost btn-sm" style="margin-left:auto" data-act="lat-keluar">Keluar</button></div>';
    h += '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + c.dj + '" aria-label="Kemajuan latihan"><i style="width:' + (c.dj / n * 100) + '%"></i></div>';
    h += '<section class="glass card qsec"><p class="qtext">' + esc(q.tanya) + '</p><div class="opts">';
    q.opsi.forEach(function (o, k) {
      var cls = '', tag = '', ex = '';
      if (done) {
        if (k === q.kunci) {
          cls = ' ok'; tag = '<span class="tag">' + (pilih === k ? 'Jawabanmu benar' : 'Jawaban yang benar') + '</span>';
          ex = q.jelas ? exTeks(true, q.jelas) : '';
        } else if (k === pilih) {
          cls = ' bad'; tag = '<span class="tag">Jawabanmu salah</span>';
          var jo = (q.jelasOpsi && q.jelasOpsi[k]) || (q.jelas ? 'Pilihan ini kurang tepat. Lihat penjelasan pada jawaban yang benar.' : '');
          ex = jo ? exTeks(false, jo) : '';
        } else cls = ' dim';
      }
      h += '<div class="og"><button type="button" class="opt' + cls + '" data-act="lat-jawab" data-k="' + k + '"' + (done ? ' disabled' : '') + '><span class="lt">' + LET[k] + '</span><span class="tx"><span>' + esc(o) + '</span>' + tag + '</span></button>' + ex + '</div>';
    });
    h += '</div></section>';
    h += '<div class="ctl"><button type="button" class="btn btn-ghost btn-step" data-act="lat-prev" aria-label="Soal sebelumnya"' + (lat.i === 0 ? ' disabled' : '') + '>' + ic('left', 22) + '</button>' +
      '<button type="button" class="btn btn-ghost" data-act="lat-akhiri"' + (sisa > 0 ? ' disabled' : '') + '>Akhiri Latihan</button>' +
      '<button type="button" class="btn btn-ghost btn-step" data-act="lat-next" aria-label="Soal berikutnya"' + (lat.i >= n - 1 ? ' disabled' : '') + '>' + ic('chev', 22) + '</button></div>';
    if (sisa > 0) h += '<p class="note" style="text-align:center">Masih ada ' + sisa + ' soal yang belum dijawab.</p>';
    return h;
  }

  function vLatNavPopup() {
    var n = lat.list.length, c = latHitung();
    var g = '<div class="nav-grid" role="group" aria-label="Nomor soal">';
    lat.list.forEach(function (x, i) {
      var v = lat.ans[x], d = v !== undefined, ok = d && v === Q[x].kunci;
      g += '<button type="button" class="nb' + (d ? (ok ? ' done' : ' bad') : '') + (i === lat.i ? ' now' : '') + '" data-act="lat-ke" data-i="' + i + '" aria-label="Soal ' + (i + 1) + (d ? (ok ? ', dijawab benar' : ', dijawab salah') : ', belum dijawab') + '"' + (i === lat.i ? ' aria-current="true"' : '') + '><span class="n">' + (i + 1) + '</span></button>';
    });
    g += '</div>';
    return '<div class="ov" data-act="nav-tutup"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="navt" data-act="noop">' +
      '<div class="sheet-h"><h2 class="h2" id="navt">Navigasi Soal</h2><button type="button" class="iconbtn" data-act="nav-tutup" aria-label="Tutup navigasi soal">' + ic('x', 18) + '</button></div>' +
      '<p class="note">Dijawab ' + c.dj + ' dari ' + n + '. Belum dijawab ' + (n - c.dj) + '. Benar ' + c.bn + '. Salah ' + (c.dj - c.bn) + '.</p>' +
      g + '<button type="button" class="btn btn-block" data-act="nav-tutup">Tutup</button></div></div>';
  }

  function latMulai(b) {
    var ids, label;
    if (!ALL.length) { toast('Belum ada soal tersedia.'); return; }
    b = b || 'semua';
    if (b === 'semua') { ids = ALL.slice(); label = 'Semua Soal'; }
    else if (b === 'salah') {
      var set = {};
      analisis(getHist()).salah.forEach(function (s) { set[s.id] = true; });
      ids = ALL.filter(function (id) { return set[id]; });
      label = 'Soal yang sering salah';
      if (!ids.length) { toast('Belum ada soal yang sering salah.'); return; }
    } else if (BAB[b]) { ids = BAB[b].soal.map(function (s) { return s.id; }); label = BAB[b].judul; }
    else return;
    muat('Menyiapkan latihan', function () {
      lat = { fase: 'jalan', list: ids, i: 0, ans: {}, b: b, label: label };
      navOpen = false; calcOpen = false;
      go('latihan');
      render({ top: true });
    });
  }

  /* ----- ujian ----- */
  function ujianJumlah() { return Math.min(D.pengaturan.ujianJumlahSoal, ALL.length); }

  function vUjian() {
    if (aktif) return vUjianJalan();
    if (ujHasil) return vUjianHasil();
    var mnt = D.pengaturan.ujianMenit;
    var h = getHist(), last = h.length ? h[h.length - 1] : null;
    return '<h1 class="h1">Ujian Quiz</h1><p class="lead">Ujikan pemahamanmu tanpa petunjuk jawaban.</p>' +
      '<section class="glass card"><h2 class="h2"><span class="dot"></span>Peraturan Pengerjaan Quiz</h2><ol class="rules">' +
      '<li>Bacalah setiap soal dengan teliti.</li>' +
      '<li>Pilih satu jawaban yang paling tepat.</li>' +
      '<li>Setiap soal hanya memiliki satu jawaban benar.</li>' +
      '<li>Waktu pengerjaan ' + mnt + ' menit.</li>' +
      '<li>Periksa kembali jawaban sebelum menyelesaikan quiz.</li>' +
      '<li>Hasil quiz ditampilkan setelah pengerjaan selesai.</li></ol>' +
      (ALL.length ? '<button type="button" class="btn btn-block" data-act="uj-mulai">' + ic('clock', 18) + 'Mulai Ujian</button>' : '<button type="button" class="btn btn-block" disabled>Mulai Ujian</button><p class="note" style="text-align:center">Belum ada soal tersedia.</p>') + '</section>' +
      (last ? '<p class="note">Ujian terakhir: nilai ' + fmtNum(last.nilai) + ' (' + last.benar + ' benar, ' + last.salah + ' salah), ' + esc(fmtDate(last.tanggal)) + '.</p>' : '');
  }

  function navGrid(a) {
    var h = '<div class="nav-grid" role="group" aria-label="Nomor soal">';
    a.ids.forEach(function (x, i) {
      var d = a.answers[x] !== undefined && a.answers[x] !== null, r = !!a.flags[x];
      var huruf = d ? LET[a.answers[x]] : '';
      h += '<button type="button" class="nb' + (d ? (r ? ' ragu' : ' done') : '') + (i === a.idx ? ' now' : '') + '" data-act="uj-ke" data-i="' + i + '" aria-label="Soal ' + (i + 1) + (d ? ', dijawab ' + huruf : ', belum dijawab') + (r ? ', ragu-ragu' : '') + '"' + (i === a.idx ? ' aria-current="true"' : '') + '><span class="n">' + (d ? huruf : (i + 1)) + '</span></button>';
    });
    return h + '</div>';
  }

  function vNavPopup() {
    var a = aktif, n = a.ids.length, dj = 0, rg = 0;
    a.ids.forEach(function (x) { if (a.answers[x] !== undefined && a.answers[x] !== null) dj++; if (a.flags[x]) rg++; });
    return '<div class="ov" data-act="nav-tutup"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="navt" data-act="noop">' +
      '<div class="sheet-h"><h2 class="h2" id="navt">Navigasi Soal</h2><button type="button" class="iconbtn" data-act="nav-tutup" aria-label="Tutup navigasi soal">' + ic('x', 18) + '</button></div>' +
      '<p class="note">Dijawab ' + dj + ' dari ' + n + '. Belum dijawab ' + (n - dj) + '. Ragu-ragu ' + rg + '.</p>' +
      navGrid(a) +
      '<button type="button" class="btn btn-block" data-act="nav-tutup">Tutup</button></div></div>';
  }

  function vUjianJalan() {
    var a = aktif, n = a.ids.length, id = a.ids[a.idx], q = Q[id];
    var jawab = a.answers, terjawab = 0, ragu = 0;
    a.ids.forEach(function (x) { if (jawab[x] !== undefined && jawab[x] !== null) terjawab++; if (a.flags[x]) ragu++; });
    var sisa = n - terjawab, isRagu = !!a.flags[id];
    var rem = Math.max(0, Math.ceil((a.endAt - Date.now()) / 1000));
    var h = '<div class="qhead"><span class="chip">Soal ' + (a.idx + 1) + ' dari ' + n + '</span>' +
      '<button type="button" class="chip chip-btn" data-act="nav-buka" aria-haspopup="dialog" aria-label="Buka navigasi soal">' + ic('grid', 14) + '</button>' +
      '<button type="button" class="chip chip-btn chip-ico" data-act="calc-buka" aria-haspopup="dialog" aria-label="Buka kalkulator">' + ic('calc', 16) + '</button>' +
      '<span class="chip timer" id="timer" role="timer" aria-label="Sisa waktu" data-low="' + (rem < 60 ? 1 : 0) + '">' + fmtTime(rem) + '</span></div>';
    h += '<section class="glass card qsec"><p class="qtext">' + esc(q.tanya) + '</p><div class="opts">';
    q.opsi.forEach(function (o, k) {
      var sel = jawab[id] === k;
      h += '<button type="button" class="opt' + (sel ? ' sel' : '') + '" data-act="uj-jawab" data-k="' + k + '" aria-pressed="' + (sel ? 'true' : 'false') + '"><span class="lt">' + LET[k] + '</span><span class="tx"><span>' + esc(o) + '</span></span></button>';
    });
    h += '</div></section>';
    h += '<div class="ctl"><button type="button" class="btn btn-ghost btn-step" data-act="uj-prev" aria-label="Soal sebelumnya"' + (a.idx === 0 ? ' disabled' : '') + '>' + ic('left', 22) + '</button>' +
      '<button type="button" class="btn btn-ghost btn-ragu" data-act="uj-ragu" aria-pressed="' + (isRagu ? 'true' : 'false') + '"' + (jawab[id] === undefined || jawab[id] === null ? ' disabled title="Pilih jawaban dulu"' : '') + '>' + ic('flag', 16) + 'Ragu-ragu</button>' +
      '<button type="button" class="btn btn-ghost btn-step" data-act="uj-next" aria-label="Soal berikutnya"' + (a.idx >= n - 1 ? ' disabled' : '') + '>' + ic('chev', 22) + '</button></div>';
    if (confirming && sisa === 0) {
      h += '<div class="confirm"><p><b>Akhiri ujian sekarang?</b> Jawaban tidak bisa diubah setelahnya.' + (ragu ? ' Masih ada ' + ragu + ' soal ditandai ragu-ragu.' : '') + '</p><div class="row"><button type="button" class="btn" data-act="uj-ya">Ya, akhiri</button><button type="button" class="btn btn-ghost" data-act="uj-batal">Kembali</button></div></div>';
    } else {
      h += '<button type="button" class="btn btn-block" data-act="uj-akhiri"' + (sisa > 0 ? ' disabled' : '') + '>Akhiri Ujian</button>';
      if (sisa > 0) h += '<p class="note" style="text-align:center">Masih ada ' + sisa + ' soal yang belum dijawab.</p>';
      else if (ragu) h += '<p class="note" style="text-align:center">Ada ' + ragu + ' soal ditandai ragu-ragu. Buka Nomor untuk meninjau.</p>';
    }
    return h;
  }

  function vUjianHasil() {
    var r = ujHasil;
    return '<h1 class="h1">Hasil Ujian</h1>' +
      '<section class="glass card"><div class="eyebrow" style="color:var(--ink-2)">Nilai</div><div class="score">' + fmtNum(r.nilai) + '<small> / 100</small></div>' +
      '<p class="lead">' + (r.waktuHabis ? 'Waktu habis. Soal yang belum dijawab dihitung salah.' : 'Ujian diakhiri.') + ' Lama pengerjaan ' + fmtTime(r.durasi) + '.</p></section>' +
      '<div class="two"><div class="glass"><b>' + r.benar + '</b><span>Jawaban benar</span></div><div class="glass"><b>' + r.salah + '</b><span>Jawaban salah</span></div></div>' +

  function finish(waktuHabis) {

  /* ----- kalkulator ----- */
  var OPSYM = { '+': '+', '-': '\u2212', '*': '\u00d7', '/': '\u00f7' };
  function calcBaru() { return { cur: '0', acc: null, op: null, fresh: false, expr: '', err: false }; }
  calc = calcBaru();
  function cFmt(x) {
    x = String(x);
    if (/e/i.test(x)) return x.replace('.', ',');
    var neg = x.charAt(0) === '-'; if (neg) x = x.slice(1);
    var p = x.split('.'), ip = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (neg ? '-' : '') + ip + (p.length > 1 ? ',' + p[1] : '');
  }
  function cHitung(a, o, b) {
    var r = o === '+' ? a + b : o === '-' ? a - b : o === '*' ? a * b : (b === 0 ? NaN : a / b);
    if (!isFinite(r)) return null;
    return String(parseFloat(r.toPrecision(12)));
  }
  function cError() { calc = calcBaru(); calc.err = true; }
  function cTekan(k) {
    if (calc.err && k !== 'C') calc = calcBaru();
    var c = calc, r;
    if (k.length === 1 && k >= '0' && k <= '9') {
      if (c.fresh) { c.cur = k; c.fresh = false; }
      else if (c.cur.replace(/[-.]/g, '').length < 15) c.cur = c.cur === '0' ? k : (c.cur === '-0' ? '-' + k : c.cur + k);
    } else if (k === '.') {
      if (c.fresh) { c.cur = '0.'; c.fresh = false; }
      else if (c.cur.indexOf('.') < 0) c.cur += '.';
    } else if (k === 'C') {
      calc = calcBaru();
    } else if (k === 'B') {
      if (!c.fresh) c.cur = (c.cur.length > 1 && !(c.cur.length === 2 && c.cur.charAt(0) === '-')) ? c.cur.slice(0, -1) : '0';
    } else if (k === 'N') {
      if (c.cur !== '0' && c.cur !== '0.') c.cur = c.cur.charAt(0) === '-' ? c.cur.slice(1) : '-' + c.cur;
    } else if (k === '%') {
      c.cur = String(parseFloat((parseFloat(c.cur) / 100).toPrecision(12))); c.fresh = true;
    } else if (OPSYM[k]) {
      if (c.op && c.acc !== null && !c.fresh) {
        r = cHitung(c.acc, c.op, parseFloat(c.cur));
        if (r === null) { cError(); return; }
        c.acc = parseFloat(r); c.cur = r;
      } else c.acc = parseFloat(c.cur);
      c.op = k; c.fresh = true; c.expr = cFmt(c.cur) + ' ' + OPSYM[k];
    } else if (k === '=') {
      if (c.op && c.acc !== null) {
        var b = c.fresh ? c.acc : parseFloat(c.cur);
        r = cHitung(c.acc, c.op, b);
        if (r === null) { cError(); return; }
        c.expr = cFmt(c.acc) + ' ' + OPSYM[c.op] + ' ' + cFmt(b) + ' =';
        c.cur = r; c.acc = null; c.op = null; c.fresh = true;
      }
    }
  }
  function calcTeks() { return calc.err ? 'Tidak valid' : cFmt(calc.cur); }
  function calcUkuran(t) { return t.length > 14 ? 22 : (t.length > 10 ? 28 : 36); }
  function calcUpdate() {
    var d = document.getElementById('calcd'), e = document.getElementById('calce');
    if (!d || !e) return;
    var t = calcTeks();
    d.textContent = t; d.style.fontSize = calcUkuran(t) + 'px';
    e.textContent = calc.expr || '\u00a0';
  }
  function vCalcPopup() {
    var K = [
      ['C', 'C', 'fn', 'Hapus semua'], ['B', ic('bksp', 22), 'fn', 'Hapus satu angka'], ['%', '%', 'fn', 'Persen'], ['/', '\u00f7', 'op', 'Bagi'],
      ['7', '7'], ['8', '8'], ['9', '9'], ['*', '\u00d7', 'op', 'Kali'],
      ['4', '4'], ['5', '5'], ['6', '6'], ['-', '\u2212', 'op', 'Kurang'],
      ['1', '1'], ['2', '2'], ['3', '3'], ['+', '+', 'op', 'Tambah'],
      ['N', '\u00b1', 'fn', 'Ubah positif atau negatif'], ['0', '0'], ['.', ',', '', 'Koma desimal'], ['=', '=', 'op', 'Sama dengan']
    ];
    var t = calcTeks();
    return '<div class="ov" data-act="calc-tutup"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="calct" data-act="noop">' +
      '<div class="sheet-h"><h2 class="h2" id="calct">Kalkulator</h2><button type="button" class="iconbtn" data-act="calc-tutup" aria-label="Tutup kalkulator">' + ic('x', 18) + '</button></div>' +
      '<div class="cdisp"><div class="ce" id="calce">' + (calc.expr ? esc(calc.expr) : '&nbsp;') + '</div><div class="cd" id="calcd" style="font-size:' + calcUkuran(t) + 'px">' + esc(t) + '</div></div>' +
      '<div class="ckeys">' + K.map(function (x) {
        return '<button type="button" class="ck' + (x[2] ? ' ' + x[2] : '') + '" data-act="calc-key" data-k="' + x[0] + '"' + (x[3] ? ' aria-label="' + x[3] + '"' : '') + '>' + x[1] + '</button>';

  function soalItem(s, tipe) {

  }
  function daftarSoal(judul, list, tipe, kosong) {

      html += '<li class="mrow"><div class="mtop"><span class="mt">' + esc(x.b.judul) + '</span><span class="pill pill-' + x.st.k + '">' + x.st.t + '</span></div>' +

  }

  function cadanganJson() {
    return JSON.stringify({ app: 'quizlearn', versi: 2, diekspor: new Date().toISOString(), riwayat: getHist() });
  }
  function pulihkan(text) {
    var obj = parse((text || '').trim(), null);
    var arr = Array.isArray(obj) ? obj : (obj && Array.isArray(obj.riwayat) ? obj.riwayat : null);
    if (!arr) { toast('Teks cadangan tidak dikenali. Pastikan disalin utuh.'); return; }
    var valid = arr.filter(validRec).map(cleanRec);
    if (!valid.length) { toast('Tidak ada riwayat yang valid di cadangan ini.'); return; }
    var h = getHist(), ada = {}, tambah = 0;
    h.forEach(function (r) { ada[r.id] = true; });
    valid.forEach(function (r) { if (!ada[r.id]) { ada[r.id] = true; h.push(r); tambah++; } });
    h.sort(function (a, b) { return new Date(a.tanggal) - new Date(b.tanggal); });
    setHist(h);
    toast(tambah + ' riwayat berhasil dipulihkan.');
    render();
  }

  /* ---------- aksi ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t || t.disabled) return;
    var act = t.getAttribute('data-act');
    var a = aktif;

    if (act === 'noop') return;
    if (act === 'go') { go(t.getAttribute('data-v')); return; }

    if (act === 'lat-mulai') { latMulai(t.getAttribute('data-b')); return; }
    if (act === 'lat-jawab') {
      var lid = lat.list[lat.i];
      if (lat.fase !== 'jalan' || lat.ans[lid] !== undefined) return;
      lat.ans[lid] = parseInt(t.getAttribute('data-k'), 10);
      render(); return;
    }
    if (act === 'lat-prev') { pindahSoal('prev', function () { if (lat.i > 0) lat.i--; }); return; }
    if (act === 'lat-next') { pindahSoal('next', function () { if (lat.i < lat.list.length - 1) lat.i++; }); return; }
    if (act === 'lat-ke') {
      var latTujuan = parseInt(t.getAttribute('data-i'), 10);
      if (latTujuan !== lat.i) { var latArah = latTujuan < lat.i ? 'prev' : 'next'; lat.i = latTujuan; render({ top: true, questionDirection: latArah }); }
      closePopup(function () { fokus('nav-buka'); });
      return;
    }
    if (act === 'lat-akhiri') { if (latHitung().dj >= lat.list.length) { lat.fase = 'selesai'; navOpen = false; render({ top: true }); } return; }
    if (act === 'lat-ulang') { latMulai(lat.b); return; }
    if (act === 'lat-keluar') { lat = latBaru(); navOpen = false; render({ top: true }); return; }

    if (act === 'uj-mulai') { ujMulai(); return; }
    if (act === 'uj-ulang') { ujHasil = null; render({ top: true }); return; }
    if (!a && act.indexOf('uj-') === 0) return;
    if (act === 'uj-jawab') { a.answers[a.ids[a.idx]] = parseInt(t.getAttribute('data-k'), 10); confirming = false; saveAktif(); render(); return; }
    if (act === 'uj-ke') {
      var ujTujuan = parseInt(t.getAttribute('data-i'), 10);
      if (ujTujuan !== a.idx) { var ujArah = ujTujuan < a.idx ? 'prev' : 'next'; a.idx = ujTujuan; confirming = false; saveAktif(); render({ top: true, questionDirection: ujArah }); }
      closePopup(function () { fokus('nav-buka'); });
      return;
    }
    if (act === 'uj-ragu') { var rid = a.ids[a.idx]; if (a.answers[rid] === undefined || a.answers[rid] === null) return; if (a.flags[rid]) delete a.flags[rid]; else a.flags[rid] = true; saveAktif(); render(); return; }
    if (act === 'calc-buka') { calcOpen = true; navOpen = false; syncOverlay(); var kb = $ov.querySelector('.iconbtn'); if (kb) kb.focus(); return; }

  /* ---------- layar sambutan ---------- */
  function welcome() {
    var el = document.createElement('div');

    function selesai() {

  /* Animasi buka buram (dipakai layar sambutan dan layar loading): lingkaran jernih melebar dari titik (cx, cy) */
  function bukaBlur(el, blur, body, cx, cy, selesai) {
    var W = window.innerWidth, H = window.innerHeight;
    var dx = Math.max(cx, W - cx), dy = Math.max(cy, H - cy);
    var soft = 160, total = Math.sqrt(dx * dx + dy * dy) + soft;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    body.classList.add('out');
    if (reduce || !window.requestAnimationFrame) { el.classList.add('fade'); setTimeout(selesai, 260); return; }
    var dur = 1100, t0 = null;
    function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
    function frame(ts) {
      if (t0 === null) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur), R = ease(p) * total;
      var sf = Math.min(soft, R);
      var m = 'radial-gradient(circle at ' + cx + 'px ' + cy + 'px, transparent ' + R + 'px, #000 ' + (R + sf) + 'px)';
      blur.style.webkitMaskImage = m; blur.style.maskImage = m;
      if (p < 1) requestAnimationFrame(frame); else selesai();
    }
    requestAnimationFrame(frame);
  }

  /* ---------- layar loading 0-100% sebelum latihan / ujian dimulai ---------- */
  var memuat = false;
  function muat(label, aksi) {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (memuat) return;
    if (reduce || !window.requestAnimationFrame) { aksi(); return; }
    memuat = true;
    var el = document.createElement('div');
    el.className = 'wel ld'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', label);
    el.innerHTML = '<div class="wel-blur"></div><div class="wel-body"><div class="logo" aria-hidden="true">' + ic('bolt', 22) + '</div>' +
      '<div class="ld-pct">0%</div><div class="ld-bar" aria-hidden="true"><i></i></div><div class="ld-lbl">' + esc(label) + '</div></div>';
    document.body.appendChild(el);
    var inertEls = [document.querySelector('.app'), document.getElementById('dock')];
    inertEls.forEach(function (x) { if (x) x.setAttribute('inert', ''); });
    document.body.style.overflow = 'hidden';
    var pct = el.querySelector('.ld-pct'), bar = el.querySelector('.ld-bar i'), blur = el.querySelector('.wel-blur'), body = el.querySelector('.wel-body');
    function selesai() {
      if (el.parentNode) el.parentNode.removeChild(el);
      inertEls.forEach(function (x) { if (x) x.removeAttribute('inert'); });
      document.body.style.overflow = (navOpen || calcOpen) ? 'hidden' : '';
      memuat = false;
      try { $main.focus({ preventScroll: true }); } catch (e) {}
    }
    var dur = 1000, t0 = null;
    function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
    function frame(ts) {
      if (t0 === null) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur), e = ease(p);
      pct.textContent = Math.round(e * 100) + '%';
      bar.style.transform = 'scaleX(' + e + ')';
      if (p < 1) { requestAnimationFrame(frame); return; }
      aksi();   // latihan/ujian dibangun di balik layar buram
      setTimeout(function () {
        var r = body.getBoundingClientRect();
        bukaBlur(el, blur, body, r.left + r.width / 2, r.top + r.height / 2, selesai);
      }, 180);
    }
    requestAnimationFrame(frame);
  }

  /* ---------- efek tekan tombol (delegasi: berlaku juga untuk tombol yang dibuat dinamis) ---------- */
  (function () {
    var selector = 'button:not([disabled]),input[type="button"]:not([disabled]),input[type="submit"]:not([disabled]),input[type="reset"]:not([disabled]),[role="button"]:not([aria-disabled="true"]),.btn:not([disabled]),.back:not([disabled]),.filebtn:not([disabled]),.chip-btn:not([disabled])';
    var pressed = null, releaseTimer = null;
    function release() {
      if (pressed) pressed.classList.remove('ql-pressed');
      pressed = null;
      if (releaseTimer) { clearTimeout(releaseTimer); releaseTimer = null; }
    }
    document.addEventListener('pointerdown', function (e) {
      var el = e.target && e.target.closest ? e.target.closest(selector) : null;
      if (!el) return;
      release();
      pressed = el;
      el.classList.add('ql-pressed');
    }, true);
    function scheduleRelease() {
      if (releaseTimer) clearTimeout(releaseTimer);
      releaseTimer = setTimeout(release, 170);
    }
    document.addEventListener('pointerup', scheduleRelease, true);
    document.addEventListener('pointercancel', release, true);
    window.addEventListener('blur', release);
    document.addEventListener('keydown', function (e) {
      if (e.key !== ' ' && e.key !== 'Enter') return;
      var el = document.activeElement;
      if (el && el.matches && el.matches(selector)) { pressed = el; el.classList.add('ql-pressed'); }
    }, true);
    document.addEventListener('keyup', function (e) {
      if (e.key === ' ' || e.key === 'Enter') scheduleRelease();
    }, true);
  })();

  /* ---------- mulai ---------- */
  if (aktif && aktif.endAt <= Date.now()) {
    finish(true);
    toast('Waktu ujian sebelumnya sudah habis. Hasil tersimpan di Progres.');
  } else {
    render();
  }
  if (!aktif) welcome();   // ujian yang sedang berjalan tidak ditunda oleh layar sambutan
})();

</script>
